<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #e0e0e0;
      width: 240px;
      padding: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 13px;
      padding: 6px 8px;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
    }

    input:focus {
      outline: none;
      border-color: #0c66e4;
    }

    .suffix {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
    }

    button {
      width: 100%;
      padding: 7px 0;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      background: #2a2a2a;
      color: #ccc;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s, color 0.1s;
    }

    button:hover {
      background: #333;
      color: #fff;
    }

    button.saved {
      border-color: #2d6a4f;
      background: #1b4332;
      color: #95d5b2;
    }

    button.error {
      border-color: #7a2d2d;
      background: #431b1b;
      color: #d59595;
    }

    @media (prefers-color-scheme: light) {
      body { background: #f5f5f5; color: #1a1a1a; }
      label { color: #666; }
      input { border-color: #d0d0d0; background: #fff; color: #000; }
      .suffix { color: #888; }
      button { border-color: #d0d0d0; background: #fff; color: #333; }
      button:hover { background: #ebebeb; color: #000; }
      button.saved { border-color: #2d6a4f; background: #d8f3dc; color: #1b4332; }
      button.error { border-color: #7a2d2d; background: #f3d8d8; color: #431b1b; }
    }
  </style>
</head>
<body>
  <label for="subdomain">Jira subdomain</label>
  <div class="field">
    <input id="subdomain" type="text" placeholder="e.g. acme" autocomplete="off" spellcheck="false">
    <span class="suffix">.atlassian.net</span>
  </div>
  <button id="save">Save</button>
  <script src="popup.js"></script>
</body>
</html>
