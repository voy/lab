name: Magenspiegel Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: false
        default: 'check'
        type: choice
        options: [check, debug, dry-run]

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.actor == 'voy'
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write config
        run: python3 magenspiegel-watch/write_config.py
        env:
          FIRST_NAME:       ${{ secrets.MAGENSPIEGEL_FIRST_NAME }}
          LAST_NAME:        ${{ secrets.MAGENSPIEGEL_LAST_NAME }}
          BIRTH_DATE:       ${{ secrets.MAGENSPIEGEL_BIRTH_DATE }}
          PHONE:            ${{ secrets.MAGENSPIEGEL_PHONE }}
          EMAIL:            ${{ secrets.MAGENSPIEGEL_EMAIL }}
          GENDER:           ${{ secrets.MAGENSPIEGEL_GENDER }}
          INSURANCE_NAME:   ${{ secrets.MAGENSPIEGEL_INSURANCE_NAME }}
          TELEGRAM_TOKEN:   ${{ secrets.MAGENSPIEGEL_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MAGENSPIEGEL_TELEGRAM_CHAT_ID }}

      - name: Run
        id: run
        run: python3 magenspiegel-watch/book.py ${{ github.event.inputs.command || 'check' }}

      - name: Disable workflow after a successful booking
        if: steps.run.outputs.booked == 'true'
        run: gh workflow disable magenspiegel-watch.yml
        env:
          GH_TOKEN: ${{ github.token }}
