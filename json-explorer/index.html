<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Explorer — voy/lab</title>
  <style>
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --accent:    #58a6ff;
      --error:     #f85149;
      --str:       #a5d6ff;
      --num:       #ffa657;
      --bool:      #ff7b72;
      --null:      #8b949e;
      --key:       #e6edf3;
      --hover:     rgba(255, 255, 255, 0.04);
      --guide:     #21262d;
      --error-bg:  rgba(248, 81, 73, 0.1);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:        #ffffff;
        --surface:   #f6f8fa;
        --border:    #d0d7de;
        --text:      #1f2328;
        --muted:     #656d76;
        --accent:    #0969da;
        --error:     #cf222e;
        --str:       #0a3069;
        --num:       #953800;
        --bool:      #cf222e;
        --null:      #6e7781;
        --key:       #1f2328;
        --hover:     rgba(0, 0, 0, 0.04);
        --guide:     #e1e6eb;
        --error-bg:  rgba(207, 34, 46, 0.06);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .breadcrumb { font-size: 14px; color: var(--muted); }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { padding: 0 4px; }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn:hover { border-color: var(--accent); color: var(--text); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn:disabled:hover { border-color: var(--border); color: var(--muted); }

    .btn-icon {
      background: none;
      border: none;
      padding: 0 4px;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
    }

    .btn-icon:hover { color: var(--text); }

    /* wrap toggle swaps between the hooked-line and overflow-arrow glyphs */
    .btn-icon .glyph-nowrap { display: none; }
    .btn-icon.is-nowrap .glyph-wrap { display: none; }
    .btn-icon.is-nowrap .glyph-nowrap { display: inline; }

    /* ── Layout ── */
    .main {
      display: grid;
      /* minmax(0,…) or the tree pane's long unwrapped rows inflate its track */
      grid-template-columns: minmax(0, var(--src-w, 1fr)) 1px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
    }

    body.state-tree   .main { grid-template-columns: 1px minmax(0, 1fr); }
    body.state-source .main { grid-template-columns: minmax(0, 1fr) 1px; }

    body.state-tree   .input-pane { display: none; }
    body.state-source .tree-pane  { display: none; }

    /* ── Splitter: the only layout control ── */
    .splitter {
      background: var(--border);
      cursor: col-resize;
      position: relative;
      transition: background 0.15s;
    }

    /* widen the hit area without widening the 1px line; when the rail is parked
       against a window edge the slack has to go inward or it lands off-screen */
    .splitter::after { content: ''; position: absolute; inset: 0 -5px; }
    body.state-tree   .splitter::after { inset: 0 -16px 0 0; }
    body.state-source .splitter::after { inset: 0 0 0 -16px; }

    .splitter:hover, .splitter.dragging { background: var(--accent); }
    /* confirms the 50/50 snap by reading as 3px without shifting the layout */
    .splitter.dragging.centered { box-shadow: 0 0 0 1px var(--accent); }
    .main.dragging { user-select: none; }

    .chev {
      position: absolute;
      top: 50%;
      opacity: 0;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.15s, color 0.15s;
      transform: translateY(-50%);
    }

    body.state-tree   .chev { left: 3px; opacity: 0.5; }
    body.state-source .chev { right: 3px; opacity: 0.5; transform: translateY(-50%) scaleX(-1); }

    /* must stay scoped to the collapsed states — unscoped, this outbids the base
       opacity:0 and a stray chevron appears beside the divider in split view */
    body.state-tree   .splitter:hover .chev,
    body.state-source .splitter:hover .chev { opacity: 1; color: var(--text); }

    /* ── Input pane ── */
    .input-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    textarea {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: none;
      outline: none;
      resize: none;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 16px;
      min-height: 0;
    }

    textarea.nowrap { white-space: pre; overflow-x: auto; }

    /* Spans the full width below both panes so a parse error stays visible even
       when the input pane is collapsed. */
    .error-bar {
      display: none;
      background: var(--error-bg);
      border-top: 1px solid var(--error);
      color: var(--error);
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      padding: 8px 16px;
      flex-shrink: 0;
    }

    .error-bar.visible { display: block; }

    /* ── Tree pane ── */
    .tree-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tree-scroll {
      flex: 1;
      overflow: auto;
      padding: 12px 16px;
      min-height: 0;
    }

    .hint {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .hint kbd {
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 5px;
    }

    /* ── Tree nodes ── */
    .node { font-family: "SF Mono", "Fira Code", Consolas, monospace; font-size: 13px; line-height: 1.7; }

    .node-row {
      display: flex;
      align-items: baseline;
      gap: 4px;
      border-radius: 4px;
      padding: 0 4px;
      margin: 0 -4px;
      cursor: default;
      white-space: nowrap;
    }

    .node-row.collapsible { cursor: pointer; }
    .node-row.collapsible:hover { background: var(--hover); }

    .toggle {
      color: var(--muted);
      width: 12px;
      flex-shrink: 0;
      user-select: none;
      font-size: 10px;
    }

    .key   { color: var(--key); flex-shrink: 0; }
    .colon { color: var(--muted); margin-right: 2px; flex-shrink: 0; }

    /* leaf values wrap under the key; min-width lets the flex item shrink below min-content */
    .leaf-value {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .tree-scroll.nowrap .leaf-value {
      min-width: auto;
      white-space: pre;
      overflow-wrap: normal;
    }

    .v-str  { color: var(--str); }
    .v-num  { color: var(--num); }
    .v-bool { color: var(--bool); }
    .v-null { color: var(--null); }

    .bracket { color: var(--muted); }
    .summary { color: var(--muted); font-size: 11px; margin-left: 4px; }

    .children {
      padding-left: 20px;
      border-left: 1px solid var(--guide);
      margin-left: 5px;
    }

    .comma { color: var(--muted); }
  </style>
</head>
<body>

<header>
  <div class="breadcrumb">
    <a href="../">voy/lab</a>
    <span class="sep">/</span>
    <span>json-explorer</span>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="btn-wrap">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 3.5h11"/>
        <g class="glyph-wrap">
          <path d="M2.5 8h8.5a2.25 2.25 0 0 1 0 4.5H7"/>
          <path d="M8.5 11 7 12.5l1.5 1.5"/>
        </g>
        <g class="glyph-nowrap">
          <path d="M2.5 8h11"/>
          <path d="M12 6.5 13.5 8 12 9.5"/>
          <path d="M2.5 12.5h7"/>
        </g>
      </svg>
    </button>
    <button class="btn" id="btn-expand">Expand all</button>
    <button class="btn" id="btn-collapse">Collapse all</button>
    <button class="btn" id="btn-copy" title="Copy beautified JSON" disabled>Copy</button>
  </div>
</header>

<div class="main">
  <div class="input-pane">
    <textarea id="input" spellcheck="false"></textarea>
  </div>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="-1"
       title="Drag to resize, snaps at 50/50 · drag into an edge to collapse a pane · double-click to reset · ⌘\ cycles">
    <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 2.5 7.5 6 4 9.5"/>
    </svg>
  </div>

  <div class="tree-pane">
    <div class="tree-scroll" id="tree"></div>
  </div>
</div>

<div class="error-bar" id="error-bar"></div>

<script>
  const inputEl  = document.getElementById('input');
  const treeEl   = document.getElementById('tree');
  const errorBar = document.getElementById('error-bar');
  const copyBtn  = document.getElementById('btn-copy');
  const mainEl   = document.querySelector('.main');
  const splitter = document.getElementById('splitter');
  const wrapBtn  = document.getElementById('btn-wrap');

  const KEY_STATE = 'json-explorer:state';
  const KEY_SPLIT = 'json-explorer:split';
  const KEY_WRAP  = 'json-explorer:wrap';

  const IS_MAC = /Mac|iP(hone|ad|od)/.test(navigator.platform || navigator.userAgent);
  const MOD    = IS_MAC ? '⌘' : 'Ctrl';

  let lastParsed = null;

  // ── Layout state ────────────────────────────────────────────────────────────
  // 'split' | 'tree' (input collapsed) | 'source' (tree collapsed)

  const STATES = ['split', 'tree', 'source'];
  let state = STATES.includes(localStorage.getItem(KEY_STATE)) ? localStorage.getItem(KEY_STATE) : 'split';

  function setState(next) {
    if (next === state) return;
    state = next;
    document.body.classList.remove(...STATES.map(s => `state-${s}`));
    document.body.classList.add(`state-${state}`);
    localStorage.setItem(KEY_STATE, state);
  }

  document.body.classList.add(`state-${state}`);

  // ── Split position ──────────────────────────────────────────────────────────
  // The snap zone doubles as the minimum pane width: you can never drag a pane
  // narrower than it, because crossing it collapses the pane instead.
  const SNAP = 120;
  // pulling the divider near the middle drops the stored width entirely, so the
  // panes fall back to 1fr/1fr — an exact 50/50 that survives a window resize
  const CENTER_SNAP = 28;

  let splitWidth = Number(localStorage.getItem(KEY_SPLIT)) || null;

  // clamps to the current window without overwriting the stored preference
  function applySplit() {
    const max = mainEl.clientWidth - SNAP;
    if (splitWidth === null || max < SNAP) {
      mainEl.style.removeProperty('--src-w');
      return;
    }
    mainEl.style.setProperty('--src-w', `${Math.min(Math.max(splitWidth, SNAP), max)}px`);
  }

  function setSplit(px) {
    if (px === null) {
      splitWidth = null;
      localStorage.removeItem(KEY_SPLIT);
    } else {
      splitWidth = px;
      localStorage.setItem(KEY_SPLIT, String(px));
    }
    applySplit();
  }

  applySplit();
  window.addEventListener('resize', applySplit);

  // ── Drag: one gesture spans all three states ────────────────────────────────

  let dragging = false, moved = false, startX = 0;

  splitter.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { splitter.setPointerCapture(e.pointerId); } catch {}
    dragging = true;
    moved = false;
    startX = e.clientX;
    splitter.classList.add('dragging');
    mainEl.classList.add('dragging');
  });

  splitter.addEventListener('pointermove', e => {
    if (!dragging) return;
    if (Math.abs(e.clientX - startX) > 3) moved = true;
    if (!moved) return;
    // absolute cursor position drives the state, so dragging back inward from a
    // collapsed edge reopens the pane even though the rail itself has moved
    const x = e.clientX - mainEl.getBoundingClientRect().left;
    if (x < SNAP) {
      setState('tree');
      splitter.classList.remove('centered');
    } else if (x > mainEl.clientWidth - SNAP) {
      setState('source');
      splitter.classList.remove('centered');
    } else {
      setState('split');
      const mid = mainEl.clientWidth / 2;
      setSplit(Math.abs(x - mid) < CENTER_SNAP ? null : x);
      splitter.classList.toggle('centered', splitWidth === null);
    }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging', 'centered');
    mainEl.classList.remove('dragging');
    // a click (no drag) on a parked rail pulls the collapsed pane back out
    if (!moved && state !== 'split') setState('split');
  }

  splitter.addEventListener('pointerup', endDrag);
  splitter.addEventListener('lostpointercapture', endDrag);

  splitter.addEventListener('dblclick', () => {
    setState('split');
    setSplit(null);
  });

  document.addEventListener('keydown', e => {
    if (!(e.metaKey || e.ctrlKey) || e.altKey || e.key !== '\\') return;
    e.preventDefault();
    setState(STATES[(STATES.indexOf(state) + 1) % STATES.length]);
  });

  // ── Soft wrap ───────────────────────────────────────────────────────────────
  // One preference for both panes: two independent wrap toggles was one more
  // switch than anybody ever set differently.

  function applyWrap(on) {
    inputEl.classList.toggle('nowrap', !on);
    treeEl.classList.toggle('nowrap', !on);
    wrapBtn.classList.toggle('is-nowrap', !on);
    const label = `Soft wrap: ${on ? 'on' : 'off'}`;
    wrapBtn.title = label;
    wrapBtn.setAttribute('aria-label', label);
    wrapBtn.setAttribute('aria-pressed', String(on));
    localStorage.setItem(KEY_WRAP, on ? '1' : '0');
  }

  applyWrap(localStorage.getItem(KEY_WRAP) !== '0');
  wrapBtn.addEventListener('click', () => applyWrap(inputEl.classList.contains('nowrap')));

  // ── Parse & render ──────────────────────────────────────────────────────────

  let debounceTimer;
  inputEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(update, 120);
  });

  // The empty state advertises pasting, so honour it from anywhere — otherwise
  // the hint is a lie in tree-only state, where the textarea isn't on screen.
  document.addEventListener('paste', e => {
    if (e.target === inputEl) return;
    const text = e.clipboardData.getData('text');
    if (!text) return;
    e.preventDefault();
    inputEl.value = text;
    update();
  });

  function update() {
    const raw = inputEl.value.trim();
    if (!raw) {
      treeEl.innerHTML = `<div class="hint">Paste JSON, or press <kbd>${MOD}V</kbd></div>`;
      errorBar.classList.remove('visible');
      lastParsed = null;
      copyBtn.disabled = true;
      return;
    }
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      errorBar.textContent = e.message;
      errorBar.classList.add('visible');
      treeEl.innerHTML = '';
      lastParsed = null;
      copyBtn.disabled = true;
      return;
    }
    errorBar.classList.remove('visible');
    lastParsed = parsed;
    copyBtn.disabled = false;
    treeEl.innerHTML = '';
    treeEl.appendChild(buildNode(parsed, null, true));
  }

  function buildNode(value, key, isLast) {
    const wrapper = document.createElement('div');
    wrapper.className = 'node';

    if (value !== null && typeof value === 'object') {
      const isArr    = Array.isArray(value);
      const entries  = isArr ? value : Object.entries(value);
      const count    = isArr ? value.length : entries.length;
      const openB    = isArr ? '[' : '{';
      const closeB   = isArr ? ']' : '}';

      const row = document.createElement('div');
      row.className = 'node-row collapsible';

      const toggle = document.createElement('span');
      toggle.className = 'toggle';
      toggle.textContent = '▾';

      row.appendChild(toggle);

      if (key !== null) {
        const k = document.createElement('span');
        k.className = 'key';
        k.textContent = JSON.stringify(key);
        const colon = document.createElement('span');
        colon.className = 'colon';
        colon.textContent = ': ';
        row.appendChild(k);
        row.appendChild(colon);
      }

      const open = document.createElement('span');
      open.className = 'bracket';
      open.textContent = openB;
      row.appendChild(open);

      const summary = document.createElement('span');
      summary.className = 'summary';
      summary.textContent = isArr ? `${count} item${count !== 1 ? 's' : ''}` : `${count} key${count !== 1 ? 's' : ''}`;
      row.appendChild(summary);

      const children = document.createElement('div');
      children.className = 'children';

      const items = isArr ? value : entries;
      items.forEach((item, i) => {
        const childKey   = isArr ? null : item[0];
        const childVal   = isArr ? item  : item[1];
        const childLast  = i === items.length - 1;
        children.appendChild(buildNode(childVal, childKey, childLast));
      });

      const closeRow = document.createElement('div');
      closeRow.className = 'node-row';
      const pad = document.createElement('span');
      pad.className = 'toggle';
      closeRow.appendChild(pad);
      const close = document.createElement('span');
      close.className = 'bracket';
      close.textContent = closeB;
      closeRow.appendChild(close);
      if (!isLast) {
        const comma = document.createElement('span');
        comma.className = 'comma';
        comma.textContent = ',';
        closeRow.appendChild(comma);
      }

      let collapsed = false;
      row.addEventListener('click', () => {
        collapsed = !collapsed;
        toggle.textContent = collapsed ? '▸' : '▾';
        summary.style.display = collapsed ? 'inline' : 'none';
        children.style.display = collapsed ? 'none' : '';
        closeRow.style.display = collapsed ? 'none' : '';
      });

      // Initially hide summary
      summary.style.display = 'none';

      wrapper.appendChild(row);
      wrapper.appendChild(children);
      wrapper.appendChild(closeRow);
    } else {
      const row = document.createElement('div');
      row.className = 'node-row';

      const pad = document.createElement('span');
      pad.className = 'toggle';
      row.appendChild(pad);

      if (key !== null) {
        const k = document.createElement('span');
        k.className = 'key';
        k.textContent = JSON.stringify(key);
        const colon = document.createElement('span');
        colon.className = 'colon';
        colon.textContent = ': ';
        row.appendChild(k);
        row.appendChild(colon);
      }

      const holder = document.createElement('span');
      holder.className = 'leaf-value';

      const val = document.createElement('span');
      if (value === null) {
        val.className = 'v-null';
        val.textContent = 'null';
      } else if (typeof value === 'string') {
        val.className = 'v-str';
        val.textContent = JSON.stringify(value);
      } else if (typeof value === 'number') {
        val.className = 'v-num';
        val.textContent = value;
      } else if (typeof value === 'boolean') {
        val.className = 'v-bool';
        val.textContent = value;
      }
      holder.appendChild(val);

      // comma lives inside the holder so it trails the last wrapped line, not the first
      if (!isLast) {
        const comma = document.createElement('span');
        comma.className = 'comma';
        comma.textContent = ',';
        holder.appendChild(comma);
      }

      row.appendChild(holder);
      wrapper.appendChild(row);
    }

    return wrapper;
  }

  // ── Expand / Collapse all ───────────────────────────────────────────────────

  function setAllCollapsed(root, collapse) {
    root.querySelectorAll('.node-row.collapsible').forEach(row => {
      const node     = row.parentElement;
      const toggle   = row.querySelector('.toggle');
      const summary  = row.querySelector('.summary');
      const children = node.querySelector(':scope > .children');
      const closeRow = node.querySelector(':scope > .node-row:last-child');
      if (!children) return;
      if (collapse) {
        toggle.textContent = '▸';
        summary.style.display = 'inline';
        children.style.display = 'none';
        if (closeRow) closeRow.style.display = 'none';
      } else {
        toggle.textContent = '▾';
        summary.style.display = 'none';
        children.style.display = '';
        if (closeRow) closeRow.style.display = '';
      }
    });
  }

  document.getElementById('btn-expand').addEventListener('click',   () => setAllCollapsed(treeEl, false));
  document.getElementById('btn-collapse').addEventListener('click', () => setAllCollapsed(treeEl, true));

  // ── Copy ────────────────────────────────────────────────────────────────────

  copyBtn.addEventListener('click', () => {
    if (!lastParsed) return;
    navigator.clipboard.writeText(JSON.stringify(lastParsed, null, 2)).then(() => {
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  });

  update();
</script>
</body>
</html>
